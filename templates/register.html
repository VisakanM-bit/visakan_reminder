<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Create Account | Bday Reminder</title>

    <link
        rel="stylesheet"
        href="{{ url_for(
            'static',
            filename='css/reminder-theme.css'
        ) }}"
    >

</head>

<body class="auth-page">


<div
    class="time-background"
    id="time-background"
>

    <div class="sun"></div>
    <div class="moon"></div>

    <div class="stars">

        <div class="star"></div>
        <div class="star"></div>
        <div class="star"></div>
        <div class="star"></div>
        <div class="star"></div>

    </div>

</div>


<div class="auth-container">


    <div class="auth-card">


        <div class="auth-logo">
            🎂
        </div>


        <h1>
            Create Account
        </h1>


        <p class="auth-subtitle">
            Start organizing your important days.
        </p>


        {% with messages =
            get_flashed_messages(
                with_categories=true
            )
        %}

            {% for category, message in messages %}

                <div class="auth-message {{ category }}">
                    {{ message }}
                </div>

            {% endfor %}

        {% endwith %}


        <form
            method="POST"
            action="{{ url_for('register') }}"
        >


            <div class="auth-field">

                <label for="name">
                    Name
                </label>

                <input
                    type="text"
                    id="name"
                    name="name"
                    placeholder="Your name"
                    autocomplete="name"
                    required
                >

            </div>


            <div class="auth-field">

                <label for="email">
                    Email
                </label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="you@example.com"
                    autocomplete="email"
                    required
                >

            </div>


            <div class="auth-field">

                <label for="password">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Create a password"
                    autocomplete="new-password"
                    required
                >

            </div>


            <button
                type="submit"
                class="auth-button"
            >
                Create Account
            </button>

        </form>


        <div class="auth-divider">
            <span>Already have an account?</span>
        </div>


        <a
            href="{{ url_for('login') }}"
            class="auth-secondary-button"
        >
            Login
        </a>


    </div>


    <button
        type="button"
        id="theme-toggle"
        class="auth-theme-toggle"
    >
        🌙
    </button>


</div>


<script
    src="{{ url_for(
        'static',
        filename='js/reminder-theme.js'
    ) }}"
></script>

</body>

</html>
