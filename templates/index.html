<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Reminder</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/style.css') }}"
    >
</head>

<body>

    <div class="app">

        <!-- Sidebar -->
        <aside class="sidebar">

            <h2>🔔 Reminder</h2>

            <nav>
                <button>🏠 Dashboard</button>
                <button>💬 Chat</button>
                <button>🎂 Birthdays</button>
                <button>⏰ Reminders</button>
                <button>📅 Calendar</button>
                <button>📜 History</button>
            </nav>

        </aside>


        <!-- Main Content -->
        <main class="main">

            <header class="topbar">

                <div>
                    <h1>Good evening 👋</h1>
                    <p>What should I remember for you?</p>
                </div>

                <div class="profile">
                    👤
                </div>

            </header>


            <!-- Chat -->
            <section class="chat-container">

                <div id="chatBox" class="chat-box">

                    <div class="message assistant">
                        <strong>Reminder Assistant</strong>
                        <p>
                            Hi! Tell me anything you want me to remember.
                        </p>
                    </div>

                    <div class="message assistant">
                        <p>
                            For example:
                            <br>
                            "Remind me to call Arun tomorrow at 7 PM."
                        </p>
                    </div>

                </div>


                <!-- Input -->
                <div class="chat-input">

                    <button
                        id="voiceButton"
                        class="icon-button"
                        title="Voice input"
                    >
                        🎤
                    </button>

                    <input
                        id="messageInput"
                        type="text"
                        placeholder="Type a reminder..."
                        autocomplete="off"
                    >

                    <button
                        id="sendButton"
                        class="send-button"
                    >
                        Send
                    </button>

                </div>

            </section>

        </main>

    </div>


    <script src="{{ url_for('static', filename='js/app.js') }}"></script>

</body>

</html>
